const nodes=new vis.DataSet(DATA.nodes), edges=new vis.DataSet(DATA.edges);
const container=document.getElementById('network');
const options={interaction:{dragNodes:true,dragView:true,zoomView:true,selectable:true,hover:true,navigationButtons:true,keyboard:{enabled:true}},physics:{enabled:false},nodes:{shape:'dot',font:{face:'Arial',size:14,color:'#222'},borderWidth:1,scaling:{min:5,max:28,label:{enabled:true,min:12,max:22}}},edges:{color:{color:'#aaa',highlight:'#555',hover:'#777'},width:1,smooth:{type:'dynamic'}},selection:{enabled:true}};
const network=new vis.Network(container,{nodes,edges},options);
const status=document.getElementById('status'); status.textContent=`${nodes.length} nós · ${edges.length} relações`;
function showInfo(id){const n=nodes.get(id); if(!n){return} const neigh=network.getConnectedNodes(id).length; const box=document.getElementById('info'); box.innerHTML='<b>'+escapeHtml(n.label||n.id)+'</b><br>Relações visíveis: '+neigh; box.style.display='block';}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
network.on('click',p=>{if(p.nodes.length) showInfo(p.nodes[0]); else document.getElementById('info').style.display='none';});
document.getElementById('find').onclick=()=>{const q=document.getElementById('search').value.trim().toLowerCase(); if(!q)return; const hit=nodes.get({filter:n=>String(n.label||n.id).toLowerCase().includes(q)}); if(hit.length){const id=hit[0].id; network.selectNodes([id]); network.focus(id,{scale:1.2,animation:true}); showInfo(id);} else alert('Pessoa não encontrada.');};
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('find').click();});
document.getElementById('reset').onclick=()=>{network.unselectAll();network.fit({animation:true});document.getElementById('info').style.display='none';};
</script></body></html>
